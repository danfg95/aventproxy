name: "Philips Avent Bridge (local)"
description: "WebRTC to RTSP bridge for Philips Avent baby monitors, built on this Home Assistant from the source of tag 2026.10.0 (fork danfg95/aventproxy, branch local-build)."
version: "2026.10.0"
slug: "aventproxy_bridge"
url: "https://github.com/thekoma/aventproxy"
arch:
  - amd64
  - aarch64
homeassistant: "2024.1.0"
stage: stable
host_network: true
apparmor: true
options:
  cameras: []
  rtsp_bind_address: "localhost"
schema:
  rtsp_bind_address: str?
  signing_key: str?
  sid: str?
  ecode: str?
  partner: str?
  app_key: str?
  device_id: str?
  package_name: str?
  api_host: str?
  talkback: bool?
  cameras:
    - camera_id: str?
      camera_name: str?
startup: "application"
boot: "auto"
environment:
  WAIT_FOR_CONFIG: "true"
map:
  - config:ro
